name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint --max-warnings=0
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Amplify Build
        run: yarn build

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # ⚠️ 토큰은 보안을 위해 GitHub Secrets에 등록하는 것이 좋습니다.
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true # 업로드 후 UI 테스트 승인 대기 없이 바로 완료
          autoAcceptChanges: true # 모든 UI 변경사항을 자동으로 승인 처리
